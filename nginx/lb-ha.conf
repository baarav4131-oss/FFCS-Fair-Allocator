upstream ffcs_api {
    server api1:5000 max_fails=2 fail_timeout=10s;
    server api2:5000 max_fails=2 fail_timeout=10s;
    server api3:5000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;

    # Q1(a) Proxy Traffic to Multi-Container Backend
    location / {
        proxy_pass http://ffcs_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Q1c: Fast 1-second timeout to prevent requests hanging on an unresponsive container
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;

        # Q1c: Seamless failover retry policy across upstreams
        # non_idempotent allows retrying POST /api/auth/login safely (read-only verification, zero database mutation)
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 3;

        # Add tracking headers for verification and transparency
        add_header X-Upstream $upstream_addr always;
    }

    # Nginx Real-Time Reverse Proxy Telemetry & Performance Probe
    location /nginx_status {
        stub_status;
        allow all;
    }
}
