version: "3.8"

services:
  api1: &api
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      INSTANCE_ID: api1
      PORT: 5000
    cpus: "1.0"
    ports:
      - "5001:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Q2c Container Hardening Directives
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/tmp

  api2:
    <<: *api
    environment:
      INSTANCE_ID: api2
      PORT: 5000
    ports:
      - "5002:5000"

  api3:
    <<: *api
    environment:
      INSTANCE_ID: api3
      PORT: 5000
    ports:
      - "5003:5000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/${NGINX_CONF:-lb-ha}.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api1
      - api2
      - api3
