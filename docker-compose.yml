services:
  api1: &api
    build: ./backend
    env_file: ./backend/.env
    environment:
      INSTANCE_ID: api1
      PORT: 5000
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
    ports:
      - "5001:5000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # Q2(c) Container Hardening
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/tmp

  api2:
    <<: *api
    environment:
      INSTANCE_ID: api2
      PORT: 5000
    ports:
      - "5002:5000"

  api3:
    <<: *api
    environment:
      INSTANCE_ID: api3
      PORT: 5000
    ports:
      - "5003:5000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/${NGINX_CONF:-lb-ha}.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
    depends_on:
      - nginx
